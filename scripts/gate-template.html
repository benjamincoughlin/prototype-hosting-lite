<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Prototype — Password Required</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0a;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
  }
  .card {
    background: #171717;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 28px;
    width: 100%;
    max-width: 360px;
  }
  h2 { margin-top: 0; font-size: 18px; }
  p { color: #aaa; font-size: 14px; line-height: 1.5; }
  input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: #0a0a0a;
    border: 1px solid #444;
    color: #eee;
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 10px;
    background: #eee;
    color: #111;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #fff; }
  .error {
    color: #f88;
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }
</style>
</head>
<body>
<div class="card" id="card">Loading…</div>
<script>
(async function () {
  const card = document.getElementById("card");

  let config;
  try {
    const res = await fetch("./config.json", { cache: "no-store" });
    config = await res.json();
  } catch {
    card.innerHTML = "<h2>Something went wrong</h2><p>Couldn't load this prototype's configuration.</p>";
    return;
  }

  if (config.status === "TAKEN_DOWN") {
    card.innerHTML = "<h2>Not available</h2><p>This prototype has been taken down.</p>";
    return;
  }

  // Expiration is checked unconditionally, before any unlock state — a
  // previously-unlocked browser must not bypass an expired link.
  if (config.expiresAt && Date.now() > new Date(config.expiresAt).getTime()) {
    card.innerHTML = "<h2>Link expired</h2><p>This prototype link has expired. Contact whoever shared it with you if you believe this is a mistake.</p>";
    return;
  }

  // Per-slug unlock flag so unlocking one prototype never grants access to
  // another one in the same browser.
  const unlockKey = "proto_unlock_" + config.slug;
  const unlockedUntil = Number(localStorage.getItem(unlockKey) || 0);
  if (unlockedUntil > Date.now()) {
    location.replace("./app/index.html");
    return;
  }

  card.innerHTML =
    '<h2>Password required</h2>' +
    '<p>Enter the password you were given to view this prototype.</p>' +
    '<form id="gateForm">' +
    '<input type="password" id="password" placeholder="Password" autofocus required autocomplete="off" />' +
    '<button type="submit">View prototype</button>' +
    '<div class="error" id="error">Incorrect password.</div>' +
    "</form>";

  document.getElementById("gateForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = document.getElementById("password").value;
    const encoder = new TextEncoder();
    const digest = await crypto.subtle.digest(
      "SHA-256",
      encoder.encode(config.passwordSalt + password)
    );
    const hashHex = Array.from(new Uint8Array(digest))
      .map((b) => b.toString(16).padStart(2, "0"))
      .join("");

    if (hashHex === config.passwordHash) {
      // 7-day sliding unlock window, matching the AWS edition's session TTL.
      localStorage.setItem(unlockKey, String(Date.now() + 7 * 24 * 60 * 60 * 1000));
      location.replace("./app/index.html");
    } else {
      document.getElementById("error").style.display = "block";
    }
  });
})();
</script>
</body>
</html>
